<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minigit</title>
<style>
  :root {
    --deep: #0a121d; --panel: #0f1a28; --rule: #1f2e42; --rule-strong: #34475f; --text: #e1e8f0; --soft: #93a3b6;
    --commit: #f2b04c; --tree: #5cc8e0; --blob: #86d39a; --warn: #f08a7b;
    --k-meta: #f2b04c; --k-stat: #8ea2bd; --k-mode: #5cc8e0; --k-sha: #86d39a; --k-name: #ffffff; --k-pad: #56687f; --k-check: #f08a7b; --k-text: #c4d0dd;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; scrollbar-color: var(--rule-strong) var(--deep); }
  ::selection { background: var(--tree); color: var(--deep); }
  body { margin: 0; background: var(--deep); color: var(--text); font: 14px/1.5 var(--sans); }
  .mono, .sha { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  header { display: flex; align-items: center; gap: 10px 22px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid var(--rule); }
  h1 { font: 650 15px var(--sans); margin: 0; }
  h1 span { color: var(--soft); font-weight: 400; margin-left: 8px; }
  .chain { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 13px var(--mono); margin-left: auto; }
  .chain svg { width: 7px; height: 10px; color: var(--soft); flex: none; }
  .chain button { font: inherit; }
  .c-commit { color: var(--commit); } .c-tree { color: var(--tree); } .c-blob { color: var(--blob); }

  .shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--rule); padding: 18px 0 32px; background: var(--panel); }
  section.work { display: grid; grid-template-columns: 290px minmax(0, 1fr); }
  .tree { border-right: 1px solid var(--rule); padding: 18px 0 32px; }
  .inspect { padding: 18px 24px 40px; min-width: 0; }
  h2 { font: 600 12px var(--sans); color: var(--soft); margin: 0 0 8px; padding: 0 24px; }
  aside h2:not(:first-child) { margin-top: 26px; }
  @media (max-width: 1000px) { .shell, section.work { grid-template-columns: minmax(0, 1fr); } aside, .tree { border-right: 0; border-bottom: 1px solid var(--rule); } }

  ul { list-style: none; margin: 0; padding: 0; }
  .tree ul ul { margin-left: 22px; border-left: 1px solid var(--rule); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .item { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; padding: 6px 24px; min-width: 0;
          transition: background .14s; }
  .tree ul ul .item { padding-left: 12px; }
  .item:hover { background: #16263a; }
  .item[aria-current="true"] { background: #1a2d45; box-shadow: inset 0 0 0 1px var(--rule-strong); }
  .item:focus-visible, .tab:focus-visible, .plain:focus-visible { outline: 2px solid var(--tree); outline-offset: -2px; }
  .item .sha { font-size: 12px; flex: none; }
  .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { display: block; font-size: 12px; color: var(--soft); }
  .glyph { flex: none; width: 14px; height: 12px; align-self: center; }
  .path { display: flex; gap: 10px; padding: 4px 24px; font: 13px var(--mono); }
  .path b { font: 600 11px var(--sans); width: 62px; flex: none; padding-top: 2px; }
  .staged b { color: var(--blob); } .changed b { color: var(--warn); } .new b { color: var(--soft); }
  .plain { margin: 12px 24px 0; padding: 6px 10px; border: 1px solid var(--rule-strong); border-radius: 4px; font-size: 13px; transition: background .14s; }
  .plain:hover { background: #16263a; }
  .hint { color: var(--soft); padding: 0 24px; margin: 0; max-width: 60ch; }

  /* inspector */
  .title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .title strong { font: 650 18px var(--sans); }
  .title strong::first-letter { text-transform: uppercase; }
  .title .sha { font-size: 13px; color: var(--soft); overflow-wrap: anywhere; }
  .facts { color: var(--soft); margin: 4px 0 14px; display: flex; gap: 4px 20px; flex-wrap: wrap; font-size: 13px; }
  .facts b { color: var(--text); font: 600 13px var(--mono); }
  .tabs { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; margin-bottom: 16px; }
  .tab { padding: 6px 14px; font: 600 13px var(--sans); border-left: 1px solid var(--rule-strong); transition: background .14s; }
  .tab:first-child { border-left: 0; }
  .tab:hover { background: #16263a; }
  .tab[aria-pressed="true"] { background: var(--text); color: var(--deep); }
  .label { font: 600 12px var(--sans); color: var(--soft); margin: 18px 0 6px; }
  .label:first-child { margin-top: 0; }
  pre { margin: 0; font: 13px/1.6 var(--mono); border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; overflow: auto;
        max-height: 380px; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--panel); }
  .links .item { padding-left: 0; padding-right: 0; border-bottom: 1px solid var(--rule); }
  table { border-collapse: collapse; width: 100%; font: 13px var(--mono); }
  th { text-align: left; font: 600 12px var(--sans); color: var(--soft); padding: 0 14px 6px 0; border-bottom: 1px solid var(--rule-strong); }
  td { padding: 6px 14px 6px 0; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  td.r, th.r { text-align: right; }

  /* byte map */
  .bytes { display: flex; flex-wrap: wrap; gap: 20px 28px; align-items: flex-start; }
  .hex { font: 13px/1.75 var(--mono); overflow-x: auto; white-space: nowrap; flex: 0 1 auto; max-width: 100%; }
  .hex .off { color: var(--k-pad); margin-right: 16px; user-select: none; }
  .hex .b { padding: 2px 3px; cursor: default; }
  .hex .gap { display: inline-block; width: 10px; }
  .hex .ascii { margin-left: 16px; letter-spacing: .5px; }
  .hex .ascii .b { padding: 2px 0; }
  .k-meta { color: var(--k-meta); } .k-stat { color: var(--k-stat); } .k-mode { color: var(--k-mode); } .k-sha { color: var(--k-sha); }
  .k-name { color: var(--k-name); font-weight: 600; } .k-pad { color: var(--k-pad); } .k-check { color: var(--k-check); } .k-text { color: var(--k-text); }
  .fields { flex: 1 1 320px; min-width: 0; max-height: 600px; overflow: auto; border-top: 1px solid var(--rule-strong); }
  .field { display: grid; grid-template-columns: 40px 104px minmax(0, 1fr); gap: 0 10px; width: 100%; text-align: left; padding: 5px 6px;
           border-bottom: 1px solid var(--rule); font: 12.5px var(--mono); }
  .field span:first-child { color: var(--k-pad); text-align: right; }
  .field span:last-child { color: var(--soft); overflow-wrap: anywhere; font-family: var(--sans); }
  .field.jump span:last-child { text-decoration: underline; text-decoration-color: var(--rule-strong); text-underline-offset: 3px; }
  .legend { display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: 12px; color: var(--soft); margin: 0 0 12px; }
  .legend i { font-style: normal; font-family: var(--mono); margin-right: 5px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style id="focus-rule"></style>
</head>
<body>
<header>
  <h1>minigit<span id="repo-name"></span></h1>
  <div class="chain" id="chain"></div>
</header>

<div class="shell">
  <aside>
    <h2>History</h2>
    <ul id="commits"></ul>
    <p class="hint" id="no-commits" hidden>No commits yet. Stage a file and commit it with minigit.py, then reload.</p>
    <h2>Working copy</h2>
    <div id="status"></div>
    <button class="plain" id="open-index">Open the index file, byte by byte</button>
  </aside>

  <section class="work">
    <div class="tree">
      <h2>Files in the selected commit</h2>
      <ul id="tree"></ul>
    </div>
    <div class="inspect" id="object" aria-live="polite"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
// repository content is written with textContent, never innerHTML
const el = (tag, cls, text) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
};
const SVG = "http://www.w3.org/2000/svg";
const ICONS = { // one stroke weight, drawn on a 14 x 12 grid
  tree: "M1 2.5h4l1.2 1.5H13v6.5H1z",
  blob: "M3 1h5.5L11 3.5V11H3zM8.5 1v2.5H11",
  commit: "M7 3.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 0 0 0-5.6zM0 6h4.2M9.8 6H14",
};
function icon(kind) {
  const svg = document.createElementNS(SVG, "svg");
  svg.setAttribute("viewBox", "0 0 14 12"); svg.setAttribute("class", "glyph c-" + kind); svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(SVG, "path");
  path.setAttribute("d", ICONS[kind]); path.setAttribute("fill", "none"); path.setAttribute("stroke", "currentColor"); path.setAttribute("stroke-width", "1.2");
  path.setAttribute("stroke-linejoin", "round");
  svg.append(path);
  return svg;
}
function chevron() {
  const svg = document.createElementNS(SVG, "svg"); svg.setAttribute("viewBox", "0 0 7 10"); svg.setAttribute("aria-hidden", "true");
  const path = document.createElementNS(SVG, "path");
  path.setAttribute("d", "M1 1l4 4-4 4"); path.setAttribute("fill", "none"); path.setAttribute("stroke", "currentColor"); path.setAttribute("stroke-width", "1.4");
  svg.append(path);
  return svg;
}
const short = (sha) => sha.slice(0, 7);
const api = (path) => fetch(path).then((r) => r.json());
let view = new URLSearchParams(location.search).get("view") === "bytes" ? "bytes" : "decoded";
let current = null;
let repo = null;

function link(kind, sha, label) {
  const row = el("button", "item");
  row.append(icon(kind), el("span", "sha c-" + kind, short(sha)), el("span", "grow", label || ""));
  row.addEventListener("click", () => inspect(sha));
  return row;
}

async function inspect(target) {
  current = target;
  const box = $("object");
  const isIndex = target === "index";
  const data = isIndex ? { type: "index", sha: ".git/index" } : await api("/api/object?sha=" + encodeURIComponent(target));
  if (data.error) { box.replaceChildren(el("p", "hint", data.error)); return; }

  const title = el("div", "title");
  title.append(el("strong", isIndex ? "" : "c-" + data.type, isIndex ? "Index file" : data.type), el("span", "sha", data.sha));
  const facts = el("p", "facts");
  const fact = (label, value) => { const s = el("span", "", label + " "); s.append(el("b", "", value)); facts.append(s); };
  if (isIndex) fact("Staged files", repo.index.length);
  else { fact("Content", data.size + " bytes"); fact("On disk", data.compressed + " bytes after zlib"); fact("File", data.file); }

  const tabs = el("div", "tabs");
  [["decoded", "Decoded"], ["bytes", "Byte by byte"]].forEach(([id, label]) => {
    const tab = el("button", "tab", label);
    tab.setAttribute("aria-pressed", String(view === id));
    tab.addEventListener("click", () => { view = id; inspect(current); });
    tabs.append(tab);
  });
  const body = el("div");
  box.replaceChildren(title, facts, tabs, body);
  if (view === "bytes") return renderBytes(body, target);

  if (isIndex) {
    const table = el("table"); const head = el("tr");
    [["Mode"], ["Blob"], ["Bytes", "r"], ["Path"]].forEach(([h, c]) => head.append(el("th", c || "", h)));
    const thead = el("thead"); thead.append(head); const tbody = el("tbody");
    repo.index.forEach((entry) => {
      const row = el("tr");
      row.append(el("td", "", entry.mode), el("td", "c-blob", short(entry.sha)), el("td", "r", entry.size), el("td", "", entry.path));
      tbody.append(row);
    });
    table.append(thead, tbody);
    body.append(el("p", "label", "What the next commit will contain"), table);
  } else if (data.type === "commit") {
    const links = el("div", "links");
    links.append(link("tree", data.commit.tree, "snapshot of the project root"));
    data.commit.parents.forEach((p) => links.append(link("commit", p, "parent commit")));
    body.append(el("p", "label", "Points to"), links, el("p", "label", "Stored text"), el("pre", "", data.text));
  } else if (data.type === "tree") {
    const links = el("div", "links");
    data.entries.forEach((e) => links.append(link(e.type, e.sha, e.mode + "  " + e.name)));
    body.append(el("p", "label", "Entries: mode, name and the object it points to"), links);
  } else if (data.binary) {
    body.append(el("p", "hint", "Binary content. Switch to Byte by byte to see it."));
  } else {
    body.append(el("p", "label", "File content" + (data.truncated ? " (first part)" : "")), el("pre", "", data.text));
  }
}

async function renderBytes(body, target) {
  const map = await api("/api/bytes?of=" + encodeURIComponent(target));
  if (map.error) { body.append(el("p", "hint", map.error)); return; }
  const bytes = map.hex.match(/../g) || [];
  const owner = new Array(bytes.length);
  map.segments.forEach((s, i) => { for (let o = s.offset; o < Math.min(s.offset + s.length, bytes.length); o++) owner[o] = i; });

  const hex = el("div", "hex");
  for (let row = 0; row < bytes.length; row += 16) {
    const line = el("div");
    line.append(el("span", "off", row.toString(16).padStart(6, "0")));
    const ascii = el("span", "ascii");
    for (let i = row; i < row + 16; i++) {
      if (i < bytes.length) {
        const seg = map.segments[owner[i]];
        const cell = el("span", "b k-" + seg.kind, bytes[i]); cell.dataset.s = owner[i];
        const code = parseInt(bytes[i], 16);
        const char = el("span", "b k-" + seg.kind, code >= 32 && code < 127 ? String.fromCharCode(code) : "."); char.dataset.s = owner[i];
        line.append(cell); ascii.append(char);
      } else line.append(el("span", "b", "\u00a0\u00a0")); // keeps the text column aligned on a short last row
      if (i % 16 === 7) line.append(el("span", "gap"));
    }
    line.append(ascii);
    hex.append(line);
  }

  const fields = el("div", "fields");
  map.segments.forEach((s, i) => {
    const jump = s.kind === "sha" && /^[0-9a-f]{40}$/.test(s.value);
    const row = el(jump ? "button" : "div", "field" + (jump ? " jump" : ""));
    row.dataset.s = i;
    row.append(el("span", "", s.offset), el("span", "k-" + s.kind, s.field), el("span", "", s.value));
    if (jump) row.addEventListener("click", () => inspect(s.value));
    fields.append(row);
  });

  // Hovering a byte or a field highlights the whole field in both columns with one CSS rule.
  const focus = (index) => {
    $("focus-rule").textContent = index === undefined ? "" :
      `[data-s="${Number(index)}"]{background:#22364f;box-shadow:0 0 0 1px var(--rule-strong)}`;
  };
  [hex, fields].forEach((pane) => {
    pane.addEventListener("mouseover", (e) => focus(e.target.closest("[data-s]")?.dataset.s));
    pane.addEventListener("mouseleave", () => focus());
  });
  hex.addEventListener("mouseover", (e) => {
    const index = e.target.closest("[data-s]")?.dataset.s;
    if (index !== undefined) fields.querySelector(`[data-s="${Number(index)}"]`)?.scrollIntoView({ block: "nearest" });
  });

  const legend = el("p", "legend");
  [["meta", "header"], ["stat", "file metadata"], ["mode", "mode"], ["sha", "object name"], ["name", "path"], ["pad", "padding"], ["check", "checksum"]]
    .forEach(([kind, label]) => { const item = el("span"); item.append(el("i", "k-" + kind, "00"), label); legend.append(item); });
  const grid = el("div", "bytes"); grid.append(hex, fields);
  body.append(legend, grid);
  if (map.truncated) body.append(el("p", "hint", `Showing the first ${bytes.length} of ${map.size} bytes.`));
}

async function treeList(sha) {
  const data = await api("/api/object?sha=" + sha);
  const list = el("ul");
  for (const entry of data.entries || []) {
    const item = el("li");
    const isTree = entry.type === "tree";
    const row = el("button", "item");
    row.append(icon(entry.type), el("span", "grow", entry.name + (isTree ? "/" : "")), el("span", "sha", short(entry.sha)));
    row.addEventListener("click", () => inspect(entry.sha));
    item.append(row);
    if (isTree) item.append(await treeList(entry.sha)); // a folder is a tree that points to more trees
    list.append(item);
  }
  return list;
}

async function selectCommit(commit, row, show) {
  document.querySelectorAll("#commits .item").forEach((b) => b.removeAttribute("aria-current"));
  row.setAttribute("aria-current", "true");
  const root = el("li");
  const rootRow = el("button", "item");
  rootRow.append(icon("tree"), el("span", "grow", "/"), el("span", "sha", short(commit.tree)));
  rootRow.addEventListener("click", () => inspect(commit.tree));
  root.append(rootRow, await treeList(commit.tree));
  $("tree").replaceChildren(root);
  inspect(show || commit.sha);
}

async function load() {
  repo = await api("/api/repo");
  $("repo-name").textContent = repo.name;
  const chain = [el("span", "", "HEAD")];
  if (repo.ref) chain.push(chevron(), el("span", "", repo.ref));
  if (repo.head) {
    const commit = el("button", "c-commit", "commit " + short(repo.head)); commit.addEventListener("click", () => inspect(repo.head));
    const tree = el("button", "c-tree", "tree " + short(repo.commits[0].tree)); tree.addEventListener("click", () => inspect(repo.commits[0].tree));
    chain.push(chevron(), commit, chevron(), tree);
  }
  $("chain").replaceChildren(...chain);

  const rows = repo.commits.map((commit) => {
    const item = el("li");
    const row = el("button", "item");
    const text = el("span", "grow", commit.subject);
    text.append(el("span", "sub", commit.author + ", " + commit.date));
    row.append(el("span", "sha c-commit", short(commit.sha)), text);
    row.addEventListener("click", () => selectCommit(commit, row));
    item.append(row);
    return item;
  });
  $("commits").replaceChildren(...rows);
  $("no-commits").hidden = repo.commits.length > 0;

  const groups = [["staged", "Staged", ["staged_new", "staged_modified", "staged_deleted"]],
                  ["changed", "Not staged", ["modified", "deleted"]], ["new", "Untracked", ["untracked"]]];
  const lines = [];
  for (const [cls, label, keys] of groups) {
    for (const path of keys.flatMap((key) => repo.status[key])) {
      const line = el("div", "path " + cls); line.append(el("b", "", label), el("span", "grow", path)); lines.push(line);
    }
  }
  $("status").replaceChildren(...(lines.length ? lines : [el("p", "hint", "Nothing to commit. The working copy matches HEAD.")]));
  $("open-index").hidden = repo.index.length === 0;
  $("open-index").addEventListener("click", () => { view = "bytes"; inspect("index"); });

  const show = new URLSearchParams(location.search).get("show");
  if (repo.commits[0]) selectCommit(repo.commits[0], rows[0].firstChild, show);
  else if (show) inspect(show);
  else $("object").replaceChildren(el("p", "hint", "Select a commit, a folder or a file to see how Git stores it."));
}

load();
</script>
</body>
</html>
